<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="description" content="เครื่องมือสร้างลิงก์จากคีย์">
  <meta name="theme-color" content="#1a0e2e">
  <title>สร้างลิงก์จากคีย์ Pro</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-primary: #0a0618;
      --bg-secondary: #1a0e2e;
      --bg-glass: rgba(20, 12, 40, 0.45);
      --text-primary: #e0d9f5;
      --text-secondary: #b7a4dd;
      --accent-primary: #b57aff;
      --accent-secondary: #c084fc;
      --accent-glow: #a855f7;
      --border-glass: rgba(180, 130, 255, 0.25);
      --card-bg: rgba(22, 12, 42, 0.7);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      background: radial-gradient(circle at 20% 20%, var(--bg-secondary), var(--bg-primary));
      min-height: 100vh;
      padding: 1rem;
      color: var(--text-primary);
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 2rem;
      padding: 1rem 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .logo-icon {
      font-size: 1.8rem;
      color: var(--accent-secondary);
    }

    .header-title {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-secondary), #e0b0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(16,185,129,0.3);
      color: #6bff8e;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      border: 1px solid var(--border-glass);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
      border-color: var(--accent-secondary);
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      border-color: #a78bfa;
      color: white;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-color: #f87171;
      color: white;
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      color: white;
    }

    .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.78rem; }
    .btn-xs { padding: 0.25rem 0.6rem; font-size: 0.7rem; }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 800px) {
      .main-content { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 1.5rem;
      padding: 1rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .panel-title {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      background: rgba(10, 5, 22, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 1rem;
      padding: 0.8rem;
      font-size: 0.85rem;
      color: var(--text-primary);
      font-family: 'Courier New', monospace;
      outline: none;
      resize: vertical;
    }

    textarea:focus {
      border-color: var(--accent-secondary);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .link-list-container {
      max-height: 350px;
      overflow-y: auto;
      border-radius: 1rem;
      background: rgba(8, 4, 20, 0.4);
      border: 1px solid var(--border-glass);
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: all 0.2s;
      flex-wrap: wrap;
    }

    .link-item:hover {
      background: rgba(120, 70, 210, 0.15);
    }

    .link-item .checkbox {
      accent-color: var(--accent-primary);
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }

    .link-item .link-text {
      flex: 1;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      word-break: break-all;
      min-width: 0;
    }

    .item-actions {
      display: flex;
      gap: 0.2rem;
    }

    .search-input {
      width: 100%;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      border: 1px solid var(--border-glass);
      background: rgba(10,5,22,0.5);
      color: var(--text-primary);
      outline: none;
      font-size: 0.85rem;
    }

    .search-input:focus {
      border-color: var(--accent-secondary);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      align-items: center;
    }

    .toast-container {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      z-index: 9999;
    }

    .toast {
      background: rgba(20, 10, 40, 0.9);
      backdrop-filter: blur(24px);
      border: 1px solid var(--accent-primary);
      border-radius: 2rem;
      padding: 0.6rem 1.2rem;
      font-weight: 500;
      font-size: 0.9rem;
      box-shadow: 0 0 20px rgba(168,85,247,0.4);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .drop-zone {
      border: 2px dashed var(--border-glass);
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
      transition: all 0.3s;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .drop-zone.drag-over {
      border-color: var(--accent-secondary);
      background: rgba(168,85,247,0.1);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
    }

    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 1.2rem;
      padding: 0.8rem;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }

    .baseurl-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
    }

    .baseurl-input {
      flex: 1;
      background: rgba(10,5,22,0.6);
      border: 1px solid var(--border-glass);
      border-radius: 2rem;
      padding: 0.4rem 0.8rem;
      color: var(--text-primary);
      font-family: monospace;
      outline: none;
      font-size: 0.85rem;
      min-width: 150px;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <i class="fas fa-bolt logo-icon"></i>
        <span class="header-title">สร้างลิงก์จากคีย์</span>
        <span class="badge">Pro</span>
      </div>
      <div class="toolbar">
        <button class="btn btn-sm" onclick="undoAction()"><i class="fas fa-undo"></i> เลิกทำ</button>
      </div>
    </header>

    <!-- Base URL แก้ให้เป็น ?key= เรียบร้อย -->
    <div class="baseurl-section">
      <label style="font-weight:600;white-space:nowrap;font-size:0.85rem;"><i class="fas fa-globe"></i> Base URL:</label>
      <input type="text" id="baseUrlInput" class="baseurl-input" value="https://marruriki0-spec.github.io/Shhes/?key=">
      <button class="btn btn-sm btn-primary" id="saveBaseUrlBtn"><i class="fas fa-save"></i> บันทึก</button>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalKeysStat">0</div>
        <div class="stat-label">คีย์ทั้งหมด</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="duplicateKeysStat">0</div>
        <div class="stat-label">คีย์ซ้ำ</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalLinksStat">0</div>
        <div class="stat-label">ลิงก์</div>
      </div>
    </div>

    <!-- Main -->
    <div class="main-content">
      <!-- ซ้าย -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title"><i class="fas fa-keyboard"></i> ป้อนคีย์</span>
          <div class="toolbar">
            <button class="btn btn-sm" id="importBtn"><i class="fas fa-file-import"></i> นำเข้า</button>
            <button class="btn btn-sm" id="pasteBtn"><i class="fas fa-paste"></i> วาง</button>
            <button class="btn btn-sm btn-danger" id="clearBtn"><i class="fas fa-eraser"></i></button>
          </div>
        </div>
        <div class="drop-zone" id="dropZone">
          <i class="fas fa-cloud-upload-alt"></i> ลากไฟล์ .txt วางที่นี่
        </div>
        <textarea id="keyInput" placeholder="วางคีย์ที่นี่...&#10;หนึ่งคีย์ต่อบรรทัด&#10;เช่น CRX-A0D671-CEBEAA"></textarea>
        <button class="btn btn-primary" id="generateBtn"><i class="fas fa-wand-magic-sparkles"></i> สร้างลิงก์</button>
      </div>

      <!-- ขวา -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title"><i class="fas fa-link"></i> ลิงก์</span>
          <div class="toolbar">
            <button class="btn btn-sm" id="selectAllBtn">เลือกทั้งหมด</button>
            <button class="btn btn-sm" id="deselectAllBtn">ยกเลิก</button>
            <button class="btn btn-sm btn-success" id="copyAllBtn"><i class="fas fa-copy"></i> คัดลอกทั้งหมด</button>
            <button class="btn btn-sm" id="copySelectedBtn"><i class="fas fa-check-double"></i> คัดลอกที่เลือก</button>
            <button class="btn btn-sm btn-danger" id="deleteSelectedBtn"><i class="fas fa-trash"></i></button>
          </div>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 ค้นหา...">
        <div class="link-list-container" id="linkListContainer">
          <div style="text-align:center;padding:2rem;opacity:0.5;">
            <i class="fas fa-inbox" style="font-size:2rem;"></i>
            <p style="margin-top:0.5rem;">ยังไม่มีลิงก์</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".txt,.csv" style="display:none;">
  <div class="toast-container" id="toastContainer"></div>

  <script>
    (function() {
      // ============ ตั้งค่า Base URL ถูกต้องแล้ว ============
      const DEFAULT_BASE_URL = 'https://marruriki0-spec.github.io/Shhes/?key=';
      const STORAGE_KEY = 'keygen_data';
      const PER_PAGE = 50;

      // ============ DOM ============
      const $ = (s) => document.querySelector(s);
      const keyInput = $('#keyInput');
      const baseUrlInput = $('#baseUrlInput');
      const linkListContainer = $('#linkListContainer');
      const searchInput = $('#searchInput');
      const toastContainer = $('#toastContainer');
      const fileInput = $('#fileInput');
      const dropZone = $('#dropZone');
      const totalKeysStat = $('#totalKeysStat');
      const duplicateKeysStat = $('#duplicateKeysStat');
      const totalLinksStat = $('#totalLinksStat');

      // ============ State ============
      let keys = [];
      let links = [];
      let duplicates = [];
      let filteredLinks = [];
      let currentPage = 1;
      const selectedLinks = new Set();
      let history = [];
      let historyIndex = -1;

      // ============ Toast ============
      function showToast(msg, type = 'info') {
        const icons = { success: '✅', error: '❌', info: '💬', warning: '⚠️' };
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = `${icons[type]} ${msg}`;
        toastContainer.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s';
          setTimeout(() => toast.remove(), 300);
        }, 2500);
      }

      // ============ คัดลอก ============
      function copyText(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.top = '0';
        textarea.style.left = '0';
        textarea.style.opacity = '0';
        textarea.style.pointerEvents = 'none';
        
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        
        let success = false;
        try {
          success = document.execCommand('copy');
        } catch (e) {
          console.error('Copy error:', e);
        }
        
        document.body.removeChild(textarea);
        return success;
      }

      // ============ History ============
      function saveHistory() {
        const snap = { keys: [...keys], links: [...links], duplicates: [...duplicates] };
        history = history.slice(0, historyIndex + 1);
        history.push(snap);
        if (history.length > 50) history.shift();
        historyIndex = history.length - 1;
      }

      window.undoAction = function() {
        if (historyIndex > 0) {
          historyIndex--;
          const snap = history[historyIndex];
          keys = [...snap.keys];
          links = [...snap.links];
          duplicates = [...snap.duplicates];
          keyInput.value = keys.join('\n');
          renderLinks();
          updateStats();
          showToast('เลิกทำแล้ว', 'info');
        }
      };

      // ============ Process ============
      function processKeys(raw) {
        if (!raw || !raw.trim()) return { keys: [], duplicates: [] };
        const lines = raw.split(/\r?\n/);
        const seen = new Set();
        const k = [], d = [];
        for (let line of lines) {
          const t = line.trim();
          if (!t) continue;
          if (seen.has(t)) { d.push(t); }
          else { seen.add(t); k.push(t); }
        }
        return { keys: k, duplicates: d };
      }

      function getBaseUrl() {
        let url = baseUrlInput.value.trim();
        if (!url) url = DEFAULT_BASE_URL;
        // ถ้าไม่มี ?key= ให้เติมให้อัตโนมัติ
        if (!url.includes('?key=')) {
          if (!url.endsWith('/')) url += '/';
          url += '?key=';
        }
        return url;
      }

      function buildLinks(keyArr) {
        const base = getBaseUrl();
        return keyArr.map(k => base + encodeURIComponent(k));
      }

      // ============ Render ============
      function renderLinks() {
        const search = searchInput.value.toLowerCase().trim();
        let display = links;
        if (search) display = links.filter(l => l.toLowerCase().includes(search));
        filteredLinks = display;

        const totalPages = Math.ceil(display.length / PER_PAGE) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PER_PAGE;
        const pageLinks = display.slice(start, start + PER_PAGE);

        linkListContainer.innerHTML = '';

        if (!pageLinks.length) {
          linkListContainer.innerHTML = `
            <div style="text-align:center;padding:2rem;opacity:0.5;">
              <i class="fas fa-inbox" style="font-size:2rem;"></i>
              <p style="margin-top:0.5rem;">${search ? 'ไม่พบลิงก์' : 'ยังไม่มีลิงก์'}</p>
            </div>`;
        } else {
          pageLinks.forEach(link => {
            const div = document.createElement('div');
            div.className = 'link-item';
            div.innerHTML = `
              <input type="checkbox" class="checkbox" ${selectedLinks.has(link) ? 'checked' : ''} data-link="${link}">
              <span class="link-text" title="${link}">${link.length > 50 ? link.substring(0,50)+'...' : link}</span>
              <div class="item-actions">
                <button class="btn btn-xs copy-one" data-link="${link}"><i class="far fa-copy"></i></button>
                <button class="btn btn-xs open-link" data-link="${link}"><i class="fas fa-external-link-alt"></i></button>
                <button class="btn btn-xs qr-link" data-link="${link}"><i class="fas fa-qrcode"></i></button>
                <button class="btn btn-xs btn-danger del-link" data-link="${link}"><i class="fas fa-trash"></i></button>
              </div>`;
            linkListContainer.appendChild(div);
          });
        }

        updateStats();
      }

      // ============ Event Delegation ============
      linkListContainer.addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        if (!btn) return;
        const link = btn.getAttribute('data-link');
        if (!link) return;

        e.preventDefault();
        e.stopPropagation();

        if (btn.classList.contains('copy-one')) {
          const ok = copyText(link);
          showToast(ok ? 'คัดลอกแล้ว!' : 'คัดลอกไม่สำเร็จ', ok ? 'success' : 'error');
        } else if (btn.classList.contains('open-link')) {
          window.open(link, '_blank');
        } else if (btn.classList.contains('qr-link')) {
          showQR(link);
        } else if (btn.classList.contains('del-link')) {
          saveHistory();
          links = links.filter(l => l !== link);
          selectedLinks.delete(link);
          renderLinks();
          showToast('ลบแล้ว', 'info');
        }
      });

      linkListContainer.addEventListener('change', function(e) {
        if (e.target.classList.contains('checkbox')) {
          const link = e.target.getAttribute('data-link');
          if (!link) return;
          if (e.target.checked) {
            selectedLinks.add(link);
          } else {
            selectedLinks.delete(link);
          }
        }
      });

      // ============ QR Modal ============
      function showQR(link) {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;';
        overlay.innerHTML = `
          <div style="background:rgba(20,12,40,0.9);backdrop-filter:blur(20px);border:1px solid #b57aff;border-radius:1.5rem;padding:1.5rem;text-align:center;">
            <h4 style="margin-bottom:0.8rem;">📱 QR Code</h4>
            <div id="qrBox" style="display:inline-block;padding:0.8rem;background:white;border-radius:0.8rem;"></div>
            <p style="margin:0.8rem 0;font-size:0.75rem;word-break:break-all;">${link}</p>
            <button class="btn btn-sm" id="closeQr" style="margin-top:0.5rem;">ปิด</button>
          </div>`;
        document.body.appendChild(overlay);
        
        new QRCode(overlay.querySelector('#qrBox'), {
          text: link, width: 160, height: 160,
          colorDark: "#1a0e2e", colorLight: "#ffffff"
        });
        
        overlay.querySelector('#closeQr').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
      }

      // ============ Stats ============
      function updateStats() {
        totalKeysStat.textContent = keys.length;
        duplicateKeysStat.textContent = duplicates.length;
        totalLinksStat.textContent = links.length;
      }

      // ============ Generate ============
      function generate() {
        const result = processKeys(keyInput.value);
        saveHistory();
        keys = result.keys;
        duplicates = result.duplicates;
        links = buildLinks(keys);
        selectedLinks.clear();
        currentPage = 1;
        renderLinks();
        saveStorage();
        showToast(`สร้าง ${links.length} ลิงก์ (ซ้ำ ${duplicates.length})`, 'success');
      }

      // ============ Storage ============
      function saveStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            keys, links, duplicates, text: keyInput.value, baseUrl: getBaseUrl()
          }));
          localStorage.setItem('keygen_baseurl', getBaseUrl());
        } catch(e) {}
      }

      function loadStorage() {
        try {
          const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (d) {
            keys = d.keys || [];
            links = d.links || [];
            duplicates = d.duplicates || [];
            keyInput.value = d.text || keys.join('\n');
            if (d.baseUrl) {
              baseUrlInput.value = d.baseUrl;
            }
          }
          const savedUrl = localStorage.getItem('keygen_baseurl');
          if (savedUrl) {
            baseUrlInput.value = savedUrl;
          }
          // ตั้งค่าเริ่มต้นถ้าไม่มี
          if (!baseUrlInput.value) {
            baseUrlInput.value = DEFAULT_BASE_URL;
          }
          renderLinks();
          updateStats();
        } catch(e) {}
      }

      // ============ Import ============
      function importFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          keyInput.value = e.target.result;
          generate();
          showToast(`นำเข้า ${file.name} แล้ว`, 'success');
        };
        reader.readAsText(file);
      }

      // ============ Events ============
      $('#generateBtn').addEventListener('click', generate);

      $('#saveBaseUrlBtn').addEventListener('click', () => {
        const url = getBaseUrl();
        baseUrlInput.value = url;
        localStorage.setItem('keygen_baseurl', url);
        if (keys.length > 0) {
          links = buildLinks(keys);
          renderLinks();
          saveStorage();
        }
        showToast('บันทึก Base URL แล้ว!', 'success');
      });

      baseUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const url = getBaseUrl();
          baseUrlInput.value = url;
          localStorage.setItem('keygen_baseurl', url);
          if (keys.length > 0) {
            links = buildLinks(keys);
            renderLinks();
            saveStorage();
          }
          showToast('บันทึก Base URL แล้ว!', 'success');
        }
      });

      $('#clearBtn').addEventListener('click', () => {
        saveHistory();
        keyInput.value = '';
        keys = []; links = []; duplicates = [];
        selectedLinks.clear();
        renderLinks();
        saveStorage();
        showToast('ล้างแล้ว', 'info');
      });

      // 🔥 ปุ่มคัดลอกทั้งหมด
      $('#copyAllBtn').addEventListener('click', function() {
        if (links.length === 0) {
          showToast('ไม่มีลิงก์ให้คัดลอก', 'warning');
          return;
        }
        const text = links.join('\n');
        const ok = copyText(text);
        if (ok) {
          showToast(`✅ คัดลอก ${links.length} ลิงก์สำเร็จ!`, 'success');
        } else {
          showToast('❌ คัดลอกไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
        }
      });

      // 🔥 ปุ่มคัดลอกที่เลือก
      $('#copySelectedBtn').addEventListener('click', function() {
        if (selectedLinks.size === 0) {
          showToast('ไม่ได้เลือกลิงก์ใด', 'warning');
          return;
        }
        const arr = [...selectedLinks];
        const text = arr.join('\n');
        const ok = copyText(text);
        if (ok) {
          showToast(`✅ คัดลอก ${arr.length} ลิงก์สำเร็จ!`, 'success');
        } else {
          showToast('❌ คัดลอกไม่สำเร็จ ลองใหม่อีกครั้ง', 'error');
        }
      });

      $('#selectAllBtn').addEventListener('click', () => {
        filteredLinks.forEach(l => selectedLinks.add(l));
        renderLinks();
      });

      $('#deselectAllBtn').addEventListener('click', () => {
        selectedLinks.clear();
        renderLinks();
      });

      $('#deleteSelectedBtn').addEventListener('click', () => {
        if (selectedLinks.size === 0) { showToast('ไม่ได้เลือกลิงก์', 'warning'); return; }
        saveHistory();
        const count = selectedLinks.size;
        links = links.filter(l => !selectedLinks.has(l));
        selectedLinks.clear();
        renderLinks();
        saveStorage();
        showToast(`ลบ ${count} ลิงก์แล้ว`, 'info');
      });

      searchInput.addEventListener('input', () => {
        currentPage = 1;
        renderLinks();
      });

      $('#importBtn').addEventListener('click', () => fileInput.click());

      $('#pasteBtn').addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          keyInput.value = text;
          generate();
        } catch {
          showToast('ไม่สามารถวางจากคลิปบอร์ดได้', 'error');
        }
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) importFile(e.target.files[0]);
        fileInput.value = '';
      });

      // Drag & Drop
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files[0]) importFile(e.dataTransfer.files[0]);
      });

      // Auto generate
      let timer;
      keyInput.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(generate, 500);
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'g') { e.preventDefault(); generate(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); window.undoAction(); }
      });

      // Init
      loadStorage();
      // ตั้งค่าเริ่มต้นถ้ายังไม่มี
      if (!baseUrlInput.value) {
        baseUrlInput.value = DEFAULT_BASE_URL;
      }
      console.log('✅ พร้อมใช้งาน! ตัวอย่างลิงก์: https://marruriki0-spec.github.io/Shhes/?key=คีย์ของคุณ');
    })();
  </script>
</body>
</html>
